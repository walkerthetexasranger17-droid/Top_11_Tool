<!doctype html><meta charset="utf-8"><title>v5 UI Smoke</title><body><div id="result">RUNNING</div><iframe id="app" src="../index.html" style="width:430px;height:900px"></iframe><script>
(async()=>{
 const out=document.getElementById('result'), frame=document.getElementById('app'); let n=0;
 const ok=(c,m)=>{if(!c)throw new Error(m);n++}; const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const skills={Tackling:80,Marking:80,Positioning:90,Heading:85,Bravery:80,Passing:82,Dribbling:90,Crossing:70,Shooting:120,Finishing:110,Fitness:80,Strength:85,Aggression:75,Speed:100,Creativity:90};
 localStorage.setItem('te:player:smoke_player',JSON.stringify({name:'Smoke Striker',age:20,ovr:110,position:'ST',roles:['ST'],skills,playstyle:'Poacher',specialAbilities:['One-on-One Scorer']}));
 await new Promise((res,rej)=>{frame.onload=res;setTimeout(()=>rej(new Error('iframe load timeout')),6000)}); await wait(500);
 const w=frame.contentWindow,d=w.document;
 ok(d.querySelector('#dashboardStats')?.textContent.includes('1'),'dashboard player count');
 d.querySelector('[data-go="squad"]').click();await wait(300);ok(d.querySelector('#page-squad').classList.contains('active'),'squad opens');ok(d.querySelectorAll('[data-player-key]').length===1,'squad player renders');
 d.querySelector('[data-player-key]').click();await wait(350);ok(d.querySelector('#page-player').classList.contains('active'),'profile opens');ok(d.querySelector('#profileName').textContent==='Smoke Striker','profile name renders');ok(d.querySelectorAll('#profileSkills .skill').length===15,'profile skills render');
 d.querySelector('#profileTrainBtn').click();await wait(350);ok(d.querySelector('#page-training').classList.contains('active'),'training opens from profile');ok(d.querySelector('#trainingPlayer').value==='player:smoke_player','training keeps selected player');
 d.querySelector('#buildSessionBtn').click();await wait(350);ok(d.querySelectorAll('#sessionList .drill-row').length===6,'six drill cards render');ok(d.querySelector('#availabilitySection').style.display!=='none','availability appears after build');
 d.querySelector('[data-go="tactics"]').click();await wait(350);ok(d.querySelector('#page-tactics').classList.contains('active'),'tactics opens');ok(d.querySelectorAll('#mentorStrip .mentor').length===7,'seven mentors render');ok(d.querySelectorAll('#tacticPlan .plan-item').length>=10,'tactic plan renders');
 d.querySelector('#moreBtn').click();await wait(100);ok(d.querySelector('#moreBackdrop').classList.contains('open'),'more sheet opens');
 localStorage.removeItem('te:player:smoke_player');localStorage.removeItem('te:training:session:player:smoke_player');out.textContent='PASS '+n+' UI assertions';out.dataset.status='pass';
})().catch(e=>{document.getElementById('result').textContent='FAIL '+e.message;document.getElementById('result').dataset.status='fail';console.error(e)});
</script></body>
