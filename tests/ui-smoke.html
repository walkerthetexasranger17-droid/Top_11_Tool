<!doctype html><meta charset="utf-8"><title>v5 UI Smoke</title><body><div id="result">RUNNING</div><iframe id="app" src="../index.html" style="width:430px;height:900px"></iframe><script>
(async()=>{
 const out=document.getElementById('result'), frame=document.getElementById('app'); let n=0;
 const ok=(c,m)=>{if(!c)throw new Error(m);n++}; const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const skills={Tackling:80,Marking:80,Positioning:90,Heading:85,Bravery:80,Passing:82,Dribbling:90,Crossing:70,Shooting:120,Finishing:110,Fitness:80,Strength:85,Aggression:75,Speed:100,Creativity:90};
 const gkSkills={Reflexes:70,Agility:70,Anticipation:70,'Rushing Out':70,Communication:70,Throwing:70,Kicking:70,Punching:70,'Aerial Reach':70,Concentration:70,Fitness:70,Strength:70,Aggression:70,Speed:70,Creativity:70};
 localStorage.setItem('te:player:smoke_player',JSON.stringify({name:'Smoke Striker',age:20,ovr:110,position:'ST',roles:['ST'],skills,playstyle:'Poacher',specialAbilities:['One-on-One Scorer']}));
 localStorage.setItem('te:player:smoke_gk',JSON.stringify({name:'Smoke Keeper',age:23,ovr:115,position:'GK',roles:['GK'],skills:gkSkills,playstyle:'',specialAbilities:[]}));
 await new Promise((res,rej)=>{frame.onload=res;setTimeout(()=>rej(new Error('iframe load timeout')),6000)}); await wait(500);
 const w=frame.contentWindow,d=w.document;
 ok(d.querySelector('#dashboardStats')?.textContent.includes('2'),'dashboard player count');
 d.querySelector('[data-go="squad"]').click();await wait(300);ok(d.querySelector('#page-squad').classList.contains('active'),'squad opens');ok(d.querySelectorAll('[data-player-key]').length===2,'squad players render');
 d.querySelector('[data-player-key="player:smoke_player"]').click();await wait(350);ok(d.querySelector('#page-player').classList.contains('active'),'profile opens');ok(d.querySelector('#profileName').textContent==='Smoke Striker','profile name renders');ok(d.querySelectorAll('#profileSkills .skill').length===15,'profile skills render');
 d.querySelector('#profileTrainBtn').click();await wait(350);ok(d.querySelector('#page-training').classList.contains('active'),'training opens from profile');ok(d.querySelector('#trainingPlayer').value==='player:smoke_player','training keeps selected player');
 d.querySelector('#buildSessionBtn').click();await wait(350);ok(d.querySelectorAll('#sessionList .drill-row').length===6,'six drill cards render');ok(d.querySelector('#availabilitySection').style.display!=='none','availability appears after build');
 d.querySelector('#trainingPlayer').value='player:smoke_gk';d.querySelector('#trainingPlayer').dispatchEvent(new Event('change',{bubbles:true}));await wait(200);d.querySelector('[data-grey="1"]').click();await wait(80);d.querySelector('#buildSessionBtn').click();await wait(300);ok([...d.querySelectorAll('#drillAvailability .avail-row')].some(x=>x.textContent.includes('Gym')&&x.textContent.includes('1 grey')),'GK physical grey skill counted');
 d.querySelector('[data-grey="2"]').click();await wait(300);ok([...d.querySelectorAll('#drillAvailability .avail-row')].some(x=>x.textContent.includes('Carioca With Ladders')&&x.textContent.includes('2 grey')),'2-grey choice expands GK candidates and auto rebuilds');
 d.querySelector('[data-grey="0"]').click();await wait(300);ok([...d.querySelectorAll('#drillAvailability .avail-row')].every(x=>x.textContent.includes('0 grey')),'0-grey GK mode is strict');
 d.querySelector('[data-go="squad"]').click();await wait(200);d.querySelector('#page-squad [data-go="add-player"]').click();await wait(250);const hero=d.querySelector('#page-add-player .hero').getBoundingClientRect(),scan=d.querySelector('#scanWindow').getBoundingClientRect();ok(d.querySelector('.scan-cta')&&getComputedStyle(d.querySelector('.scan-cta')).display!=='none','scanner choose button visible');ok(scan.top>=hero.bottom,'scanner card does not collide with hero');
 d.querySelector('[data-go="tactics"]').click();await wait(350);ok(d.querySelector('#page-tactics').classList.contains('active'),'tactics opens');ok(d.querySelectorAll('#mentorStrip .mentor').length===7,'seven mentors render');ok(d.querySelectorAll('#tacticPlan .plan-item').length>=10,'tactic plan renders');
 d.querySelector('#moreBtn').click();await wait(100);ok(d.querySelector('#moreBackdrop').classList.contains('open'),'more sheet opens');
 localStorage.removeItem('te:player:smoke_player');localStorage.removeItem('te:player:smoke_gk');localStorage.removeItem('te:training:session:player:smoke_player');localStorage.removeItem('te:training:session:player:smoke_gk');out.textContent='PASS '+n+' UI assertions';out.dataset.status='pass';
})().catch(e=>{document.getElementById('result').textContent='FAIL '+e.message;document.getElementById('result').dataset.status='fail';console.error(e)});
</script></body>
