<!doctype html><meta charset="utf-8"><title>v5.2.10 UI Smoke</title>
<body><div id="result">RUNNING</div><iframe id="app" src="../index.html" style="width:430px;height:900px;border:0"></iframe>
<script>
(async()=>{
 const out=document.getElementById('result'),frame=document.getElementById('app');let n=0;
 const ok=(c,m)=>{if(!c)throw new Error(m);n++},wait=ms=>new Promise(r=>setTimeout(r,ms));
 const attrs=['Fitness','Strength','Aggression','Speed','Creativity','Passing','Dribbling','Crossing','Shooting','Finishing','Tackling','Marking','Positioning','Heading','Bravery','Reflexes','Agility','Anticipation','Rushing Out','Communication','Throwing','Kicking','Punching','Aerial Reach','Concentration'];
 const allSkills=(base=100)=>Object.fromEntries(attrs.map((a,i)=>[a,base+(i%7)]));
 for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k?.startsWith('te:'))localStorage.removeItem(k);}
 const roster=[
  ['gk','Smoke Keeper',['GK'],115],['dl','Left Back',['DL'],106],['dc1','Centre One',['DC'],111],['dc2','Centre Two',['DC'],109],['dr','Right Back',['DR'],107],
  ['ml','Left Mid',['ML'],108],['mc1','Mid One',['MC'],114],['mc2','Mid Two',['MC'],112],['mr','Right Mid',['MR'],110],['st1','Smoke Striker',['ST'],118],['st2','Second Striker',['ST'],113],['am','Bench Creator',['AMC','AMR','AML','MC'],116]
 ];
 roster.forEach(([id,name,roles,ovr],idx)=>localStorage.setItem('te:player:smoke_'+id,JSON.stringify({name,age:18+(idx%8),ovr,position:roles[0],roles,relatedRoles:idx===11?['ST','MR']:[],skills:allSkills(90+idx),playstyle:idx===6?{type:'BOX_TO_BOX',level:3,points:5276,nextLevelProgress:.7,boost:[10,15]}:(roles[0]==='GK'?{type:'BOX_COMMANDER',level:3,points:5400}:{type:null,level:0}),specialAbilities:idx===9?['Penalty Kick Specialist','Long Shots','Playmaker']:[],availability:'Available',condition:99,scanner:{version:2,confidence:{overall:.97}}})));
 await new Promise((res,rej)=>{frame.onload=res;setTimeout(()=>rej(new Error('iframe load timeout')),10000)});await wait(800);
 const d=frame.contentDocument,w=frame.contentWindow;
 ok(d.querySelector('#dashboardStats')?.textContent.includes('12'),'dashboard sees migrated squad');
 d.querySelector('[data-go="squad"]').click();await wait(250);ok(d.querySelector('#page-squad').classList.contains('active'),'Squad opens');ok(d.querySelectorAll('#squadList .player-row').length===12,'Squad renders 12 players');
 d.querySelector('#squadRoleFilter').value='ST';d.querySelector('#squadRoleFilter').dispatchEvent(new Event('change',{bubbles:true}));await wait(120);ok(d.querySelectorAll('#squadList .player-row').length===2,'role filter works');
 d.querySelector('#clearSquadFiltersBtn').click();await wait(100);d.querySelector('#squadSearch').value='Creator';d.querySelector('#squadSearch').dispatchEvent(new Event('input',{bubbles:true}));await wait(100);ok(d.querySelectorAll('#squadList .player-row').length===1,'Squad search works');d.querySelector('#clearSquadFiltersBtn').click();await wait(100);
 d.querySelector('[data-player-key="player:smoke_mc1"]').click();await wait(250);ok(d.querySelector('#profileName').textContent==='Mid One','Player Profile opens');ok(d.querySelector('#profilePlaystyleState').textContent.includes('5276'),'full playstyle state displays points');ok(d.querySelectorAll('#profileRoleScores .profile-key').length>=1,'Role Score renders');
 d.querySelector('#profileEditBtn').click();await wait(100);ok(d.querySelector('#profileAbilityPicker').textContent.includes('Counter Attack Stopper'),'all 19 current SAs available in manual editor');
 d.querySelector('#profileCancelEditBtn').click();d.querySelector('#profileTrainBtn').click();await wait(250);ok(d.querySelector('#trainingPlayer').value==='player:smoke_mc1','Train This Player preserves selection');d.querySelector('#buildSessionBtn').click();await wait(450);ok(d.querySelectorAll('#sessionList .drill-row').length===6,'Individual Training renders six-slot beam result');ok(d.querySelector('#sessionSummary').textContent.includes('Recommendation score'),'training output labels recommendation score');
 d.querySelector('[data-training-tab="team"]').click();await wait(350);ok(d.querySelectorAll('#teamTrainingCards .team-card').length===4,'Team Training renders four Bible groups');
 d.querySelector('[data-go="team-plan"]').click();await wait(1400);ok(d.querySelector('#page-team-plan').classList.contains('active'),'Team Plan opens');
 if(!d.querySelectorAll('#formationPitch .pitch-player').length){d.querySelector('#buildTeamPlanBtn').click();await wait(1400);}
 ok(d.querySelectorAll('#formationPitch .pitch-player').length===11,'formation pitch renders XI');ok(d.querySelectorAll('#formationXIList .xi-detail-card').length===11,'formation detail presents all 11 starters');ok([...d.querySelectorAll('#formationXIList .xi-detail-card')].every(x=>x.textContent.includes('Weakest 3 role-key skills')&&x.textContent.includes('ROLE SCORE')),'formation detail includes weakest 3 and Role Score');
 ok(d.querySelectorAll('#tacticPlan .plan-item').length===11,'Tactics renders all 11 settings');ok(d.querySelector('#tacticFitNote').textContent.includes('19440'),'Tactics shows exhaustive 19,440 candidate search');ok(d.querySelectorAll('#mentorAlternatives .mentor-alt').length>=2,'Mentor renders at least two alternatives');
 const before=[...d.querySelectorAll('#formationPitch .pitch-player')].map(x=>x.dataset.playerKey+'@'+x.dataset.assignedRole+'@'+x.dataset.x+','+x.dataset.y).join('|');d.querySelector('#planApproach').value='attacking';d.querySelector('#planApproach').dispatchEvent(new Event('change',{bubbles:true}));await wait(1100);const after=[...d.querySelectorAll('#formationPitch .pitch-player')].map(x=>x.dataset.playerKey+'@'+x.dataset.assignedRole+'@'+x.dataset.x+','+x.dataset.y).join('|');ok(before===after,'Approach change does not reshuffle XI');
 d.querySelector('[data-go="squad"]').click();await wait(150);const add=d.querySelector('#page-squad [data-go="add-player"]')||d.querySelector('[data-go="add-player"]');add.click();await wait(220);const hero=d.querySelector('#page-add-player .hero').getBoundingClientRect(),scan=d.querySelector('#scanWindow').getBoundingClientRect();ok(d.querySelector('.scan-cta')&&getComputedStyle(d.querySelector('.scan-cta')).display!=='none','Scanner choose CTA visible');ok(scan.top>=hero.bottom-1,'Scanner card does not overlap Add Player hero');
 d.querySelector('#moreBtn').click();await wait(80);ok(d.querySelector('#moreBackdrop').classList.contains('open'),'More sheet opens');
 out.textContent='PASS '+n+' UI assertions';out.dataset.status='pass';
})().catch(e=>{document.getElementById('result').textContent='FAIL '+e.message;document.getElementById('result').dataset.status='fail';console.error(e)});
</script></body>
